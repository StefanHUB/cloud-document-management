# Docker Compose configuration for Cloud Document Management System
# Runs frontend and backend as separate containers
#
# Usage:
#   docker compose up --build
#
# Frontend: http://localhost:3000
# Backend API: http://localhost:8000
# Swagger docs: http://localhost:8000/docs

version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: docmgmt-backend
    ports:
      - "8000:8000"
    environment:
      - STORAGE_BACKEND=gcs
      - GCS_BUCKET_NAME=doc-management-demo
      - GOOGLE_APPLICATION_CREDENTIALS=/app/credentials.json
    volumes:
      - backend-uploads:/app/uploads
      - C:/Users/vorni/Downloads/weighty-disk-504909-u8-6e5c1975c16f.json:/app/credentials.json:ro
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: docmgmt-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend-uploads: